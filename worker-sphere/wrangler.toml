# garden-sphere: Brodie's thinking (Claude Haiku) and his voice (ElevenLabs), for the Garden of Delight. Built and deployed by
# Workers Builds from this repo (root /worker-sphere) on every push. Its keys are secrets, set in the dashboard: ANTHROPIC_API_KEY,
# and for the voice ELEVENLABS_API_KEY.
name = "garden-sphere"
main = "sphere.js"
compatibility_date = "2026-11-01"

[vars]
ORIGINS = "https://linglab.org,https://samuelling.github.io,*.claudeusercontent.com,http://localhost"
MODEL = "claude-haiku-5-5"
BRODIE_VOICE = "JMggHO1NiDgr3D9FFONs"   # ElevenLabs: Luis (bright, relaxed, casual), chosen 26 Nov 2026

# each address: twelve asks a minute, to /chat and /speak separately
[[ratelimits]]
name = "LIMIT"
namespace_id = "2401"
  [ratelimits.simple]
  limit = 12
  period = 60
